repos:
  - repo: local
    hooks:
      - id: source-secret-scan
        name: Scan staged contents for credentials
        entry: python3 benchmark/triton-bench/scripts/scan_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: reviewed-baseline
        name: Preserve reviewed baseline files and licenses
        entry: python3 benchmark/triton-bench/scripts/check_reviewed_baseline.py --platform benchmark/triton-bench --baseline benchmark/triton-bench/docs/quality/reviewed-baseline.json --approved benchmark/triton-bench/docs/quality/reviewed-changes.json
        language: system
        pass_filenames: false
        always_run: true
